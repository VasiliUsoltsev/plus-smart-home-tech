spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/order_db
    username: dbuser
    password: "12345"
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          product-service:
            loggerLevel: basic
          inventory-service:
            connectTimeout: 1000
            readTimeout: 2000
          default:
            connectTimeout: 2000
            readTimeout: 3000

server:
  port: 0

logging:
  level:
    ru.yandex.practicum.order.client: DEBUG

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
  timelimiter:
    configs:
      default:
        timeout-duration: 3s
