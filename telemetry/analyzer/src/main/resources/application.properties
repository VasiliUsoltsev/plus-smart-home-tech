

kafka.snapshot-consumer-group-id=analyzer-snapshot-group
kafka.snapshot-consumer-topic=telemetry.snapshots.v1
kafka.snapshot-consumer-key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
kafka.snapshot-consumer-value-deserializer=ru.yandex.practicum.collector.serialization.deserializer.SnapshotDeserializer
kafka.snapshot-consumer-max-poll-records-config=100

kafka.hub-event-consumer-group-id=analyzer-hub-event-group
kafka.hub-event-consumer-topic=telemetry.hubs.v1
kafka.hub-event-consumer-key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
kafka.hub-event-consumer-value-deserializer=ru.yandex.practicum.collector.serialization.deserializer.HubEventDeserializer
kafka.hub-event-consumer-max-poll-records-config=10


# gRPC
grpc.client.hub-router.address=static://127.0.0.1:59090
grpc.client.hub-router.enableKeepAlive=true
grpc.client.hub-router.keepAliveWithoutCalls=true
grpc.client.hub-router.negotiationType=plaintext

# bd
spring.datasource.url=jdbc:postgresql://localhost:5432/telemetry_analyzer
spring.datasource.username=dbuser
spring.datasource.password=12345
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# SQL
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql



