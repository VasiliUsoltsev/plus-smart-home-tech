kafka:
  snapshot-consumer:
    group-id: analyzer-snapshot-group
    topic: telemetry.snapshots.v1
    key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    value-deserializer: ru.yandex.practicum.collector.serialization.deserializer.SnapshotDeserializer
    max-poll-records-config: 100

  hub-event-consumer:
    group-id: analyzer-hub-event-group
    topic: telemetry.hubs.v1
    key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    value-deserializer: ru.yandex.practicum.collector.serialization.deserializer.HubEventDeserializer
    max-poll-records-config: 10

# gRPC
grpc:
  client:
    hub-router:
      address: static://127.0.0.1:59090
      enableKeepAlive: true
      keepAliveWithoutCalls: true
      negotiationType: plaintext

# BD
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/telemetry_analyzer
    username: dbuser
    password: "12345"
    driver-class-name: org.postgresql.Driver

  # JPA
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 50
    open-in-view: false

  # SQL
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql